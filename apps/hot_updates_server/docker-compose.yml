version: '3.9'

services:
  api:
    build:
      context: .
      target: dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hot_updates
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-west-000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-hot-updates-dev}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev_admin_token}
      PORT: 3000
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run start:dev

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hot_updates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: these dev credentials must not be reachable from the network.
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Loopback only: this Redis has no password.
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  postgres_data:
  redis_data:
